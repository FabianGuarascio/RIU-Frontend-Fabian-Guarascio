<div class="flex flex-col gap-4 p-4 sm:p-6">
  <div class="flex flex-col gap-4 sm:flex-row sm:items-start sm:justify-between">
    <mat-form-field appearance="outline" class="w-full sm:max-w-sm sm:flex-1">
      <mat-label>Filter by name</mat-label>
      <mat-icon matPrefix>search</mat-icon>
      <input matInput [formControl]="filterControl" placeholder="e.g. man" />
    </mat-form-field>

    <button mat-flat-button color="primary" class="w-full sm:w-auto" (click)="addHero()">
      <mat-icon>add</mat-icon>
      Add hero
    </button>
  </div>

  @if (errorMessage()) {
    <p class="text-(--mat-sys-error)" role="alert">{{ errorMessage() }}</p>
  }

  <div class="relative w-full overflow-x-auto">
    @if (isLoading()) {
      <div
        class="absolute inset-0 z-10 flex items-center justify-center bg-(--mat-sys-surface)/60"
      >
        <mat-spinner diameter="40" />
      </div>
    }

    <table mat-table [dataSource]="pagedHeroes()" class="w-full">
      <ng-container matColumnDef="name">
        <th mat-header-cell *matHeaderCellDef>Name</th>
        <td mat-cell *matCellDef="let hero">
          <button
            type="button"
            class="text-left underline-offset-2 hover:underline"
            (click)="viewHero(hero)"
          >
            {{ hero.name }}
          </button>
        </td>
      </ng-container>

      <ng-container matColumnDef="secretIdentity">
        <th mat-header-cell *matHeaderCellDef class="hidden! sm:table-cell!">Secret identity</th>
        <td mat-cell *matCellDef="let hero" class="hidden! sm:table-cell!">
          {{ hero.secretIdentity ?? '—' }}
        </td>
      </ng-container>

      <ng-container matColumnDef="origin">
        <th mat-header-cell *matHeaderCellDef>Origin</th>
        <td mat-cell *matCellDef="let hero">{{ hero.origin }}</td>
      </ng-container>

      <ng-container matColumnDef="age">
        <th mat-header-cell *matHeaderCellDef class="hidden! md:table-cell!">Age</th>
        <td mat-cell *matCellDef="let hero" class="hidden! md:table-cell!">{{ hero.age }}</td>
      </ng-container>

      <ng-container matColumnDef="actions">
        <th mat-header-cell *matHeaderCellDef>Actions</th>
        <td mat-cell *matCellDef="let hero">
          <button
            mat-icon-button
            [attr.aria-label]="'View ' + hero.name"
            matTooltip="Go to the details of the hero"
            (click)="viewHero(hero)"
          >
            <mat-icon>visibility</mat-icon>
          </button>
          <button mat-icon-button [attr.aria-label]="'Edit ' + hero.name" (click)="editHero(hero)">
            <mat-icon>edit</mat-icon>
          </button>
          <button
            mat-icon-button
            [attr.aria-label]="'Delete ' + hero.name"
            (click)="deleteHero(hero)"
          >
            <mat-icon>delete</mat-icon>
          </button>
        </td>
      </ng-container>

      <tr mat-header-row *matHeaderRowDef="displayedColumns"></tr>
      <tr mat-row *matRowDef="let row; columns: displayedColumns"></tr>

      <tr class="mat-row" *matNoDataRow>
        <td class="mat-cell" [attr.colspan]="displayedColumns.length">
          @if (isLoading()) {
            Loading heroes…
          } @else {
            No heroes found.
          }
        </td>
      </tr>
    </table>
  </div>

  <mat-paginator
    class="w-full"
    [length]="totalHeroes()"
    [pageIndex]="pageIndex()"
    [pageSize]="pageSize()"
    [pageSizeOptions]="[5, 10, 25]"
    (page)="onPage($event)"
    aria-label="Select page of heroes"
  ></mat-paginator>
</div>
